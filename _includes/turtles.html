{% for item in site.data.turtles %}
  <ul>
    <li style="list-style: none;">
      <p><a href="/assets/media/images/turtles/{{ item.url }}"
      alt="{{ item.title }}">
      <img src="/assets/media/images/turtles/{{ item.thumbnail }}"
      alt="{{ item.title }}"></a></p>
    </li>
  </ul>
{% endfor %}
