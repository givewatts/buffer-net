{% for item in site.data.turtles %}
  <ul>
    <li style="list-style: none;">
      <figure> 
        <p><a href="/assets/media/images/turtles/{{ item.url }}"
        alt="{{ item.title }}">
        <img src="/assets/media/images/turtles/{{ item.thumbnail }}"
        alt="{{ item.title }}"></a>
	<figcaption>Red eared slider poking out its head from the water
	- Grounds for Sculpture, Hamilton, New Jersey, USA</figcaption></p>
      </figure>
    </li>
  </ul>
{% endfor %}
