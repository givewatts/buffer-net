<ul>
	{% for post in site.posts %}
		<li>
			<p><a href="{{ post.url }}" class="textlink">{{ post.title }}</a>
      <br>
      by <span class="bold">{{ post.author }}</span> -- 
      {{ post.date | date_to_string }}</p>
        <div class="content_border">
          <h3>Preview</h3>
          {{ post.excerpt }}
        </div>
		</li>
	{% endfor %}
</ul>
